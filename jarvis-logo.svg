<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202e"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <linearGradient id="trait" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd0ff"/>
      <stop offset="1" stop-color="#f2c14e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fond)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#3fd0ff" stroke-opacity=".25"/>
  <!-- deux petites bougies en arrière-plan -->
  <line x1="18" y1="17" x2="18" y2="33" stroke="#3fd0ff" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="15.5" y="21" width="5" height="8" rx="1.2" fill="#3fd0ff" fill-opacity=".45"/>
  <line x1="27" y1="13" x2="27" y2="29" stroke="#3fd0ff" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="24.5" y="16" width="5" height="9" rx="1.2" fill="#3fd0ff" fill-opacity=".6"/>
  <!-- le J : une grande bougie (mèche + corps) qui se termine en courbe de prix -->
  <line x1="41" y1="8" x2="41" y2="15" stroke="#f2c14e" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="36.5" y="14" width="9" height="19" rx="2.2" fill="#f2c14e"/>
  <path d="M41 33 V39 C41 49 34 54 26 53 C19 52 15 47 15 41" fill="none" stroke="url(#trait)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="15" cy="41" r="3.4" fill="#3fd0ff"/>
</svg>
